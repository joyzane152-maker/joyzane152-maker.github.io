name: fetch-images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download brand images
        run: |
          [ -f images.txt ] || exit 0
          while read -r path url; do
            [ -z "$path" ] && continue
            [ -f "$path" ] && continue
            mkdir -p "$(dirname "$path")"
            curl -fsSL -A "Mozilla/5.0" -o "$path" "$url" && echo "ok $path" || echo "FAILED $path"
          done < images.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Add brand images" && git push)
